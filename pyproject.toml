[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mongoz"
description = "Typed asynchronous MongoDB documents and queries for Python."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dynamic = ["version"]
authors = [{ name = "Tiago Silva", email = "tiago.arasivla@gmail.com" }]
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: AnyIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.9,<3.0",
    "pymongo>=4.13,<5.0",
]
keywords = ["mongoz", "odm", "nosql", "mongodb"]

[project.urls]
Homepage = "https://github.com/dymmond/mongoz"
Documentation = "https://mongoz.dymmond.com"
Changelog = "https://mongoz.dymmond.com/release-notes/"
Funding = "https://github.com/sponsors/tarsil"
Source = "https://github.com/dymmond/mongoz"
Issues = "https://github.com/dymmond/mongoz/issues"
Security = "https://github.com/dymmond/mongoz/security/policy"


[tool.hatch.version]
path = "mongoz/__init__.py"

[project.optional-dependencies]
testing = [
    "a2wsgi==1.10.10",
    "anyio==4.14.2",
    "httpx==0.28.1",
    "lilya==0.27.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pymongo==4.17.0",
    "pytest==9.1.1",
    "pytest-codspeed>=4.3.0",
    "pytest-cov==7.1.0",
    "ravyn[standard]==0.4.1",
    "tomli>=2.0.0; python_version < '3.11'",
]

quality = [
    "pre-commit==4.6.2",
    "ruff==0.16.5",
    "ty==0.0.77",
]

packaging = [
    "tomli>=2.0.0; python_version < '3.11'",
    "twine==7.0.0",
]

docs = [
    "mkdocs-meta-descriptions-plugin==4.1.0",
    "zensical==0.0.57",
]

[tool.hatch.envs.default]
features = ["quality", "packaging"]
dependencies = [
    "devtools>=0.12.2",
    "ipython",
    "ptpython",
]

[tool.hatch.envs.default.scripts]
clean_pyc = "find . -type f -name \"*.pyc\" -delete"
clean_pyi = "find . -type f -name \"*.pyi\" -delete"
clean_pycache = "find . -type d -name \"*__pycache__*\" -delete"
lint = "ruff check mongoz tests scripts benchmarks {args}"
format-check = "ruff format --check mongoz tests scripts benchmarks {args}"
format = [
    "ruff check --fix mongoz tests scripts benchmarks {args}",
    "ruff format mongoz tests scripts benchmarks {args}",
]
typing = "ty check {args}"
typing-negative = "python scripts/validate_negative_typing.py {args}"
pre-commit-check = "pre-commit run --all-files"
quality = [
    "hatch run lint",
    "hatch run format-check",
    "hatch run typing",
    "hatch run typing-negative",
    "hatch run test:coverage",
    "hatch run docs:validate",
    "hatch run package:validate",
]
mongodb-standalone-up = "docker compose -p mongoz-standalone -f compose.yml up -d --wait"
mongodb-standalone-down = "docker compose -p mongoz-standalone -f compose.yml down --volumes --remove-orphans"
mongodb-standalone-smoke = "python scripts/mongodb_topology.py standalone {args}"
mongodb-replica-set-up = "docker compose -p mongoz-replica-set -f compose.replica-set.yml up -d --wait"
mongodb-replica-set-down = "docker compose -p mongoz-replica-set -f compose.replica-set.yml down --volumes --remove-orphans"
mongodb-replica-set-smoke = "python scripts/mongodb_topology.py replica-set {args}"
acceptance = "python scripts/acceptance.py"

[tool.hatch.envs.docs]
features = ["docs"]
dependencies = []

[tool.hatch.envs.docs.scripts]
prepare = "python scripts/docs.py prepare"
clean = "python scripts/docs.py clean"
build = "python scripts/docs.py build --clean-cache"
validate = "python scripts/validate_docs.py"
serve = "python scripts/docs.py serve {args}"
dev = "python scripts/docs.py serve {args}"

[tool.hatch.envs.test]
features = ["testing"]
dependencies = []

[tool.hatch.envs.test.scripts]
# needs docker services running
test = "pytest --disable-warnings tests {args}"
focused = "pytest --disable-warnings {args}"
warnings = "pytest --disable-warnings -p scripts.pytest_warning_policy tests {args}"
coverage = "pytest --disable-warnings -p scripts.pytest_warning_policy --cov=mongoz --cov-branch --cov-config=pyproject.toml --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=json:coverage.json tests {args}"

[tool.hatch.envs.matrix]
template = "test"

[[tool.hatch.envs.matrix.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.package]
features = ["packaging"]
dependencies = []

[tool.hatch.envs.package.scripts]
validate = "python scripts/validate_package.py {args}"

[tool.hatch.envs.release]
features = ["packaging"]
dependencies = []

[tool.hatch.envs.release.scripts]
validate = "python scripts/release.py validate {args}"

[tool.hatch.envs.security]
dependencies = ["pip-audit==2.10.1"]

[tool.hatch.envs.security.scripts]
audit = "pip-audit --strict . {args}"


[tool.ty.src]
include = ["mongoz", "tests/typing/positive"]

[tool.ty.terminal]
error-on-warning = true

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "C", "B", "I"]
ignore = ["E501", "B008", "C901", "B026"]

exclude = ["docs_src/"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.coverage.run]
branch = true
relative_files = true
source = ["mongoz"]

[tool.coverage.report]
# Corrected Python 3.13 baseline measured on 2026-09-01: 88.97% branch coverage.
# The 88.95 floor allows display rounding only; losing one covered line fails.
fail_under = 88.95
precision = 2
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"

[tool.mongoz.warning-ratchet]
# Pydantic deprecations are intentionally absent. Unknown categories fail the gate,
# so any reintroduced Pydantic deprecation is rejected rather than allowlisted.
"builtins.UserWarning" = 0

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
xfail_strict = true
junit_family = "xunit2"
markers = [
    "benchmark: mark a test as a CodSpeed benchmark",
]

[tool.hatch.build.targets.sdist]
include = ["/mongoz"]
