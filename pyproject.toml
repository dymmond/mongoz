[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mongoz"
description = "ODM with pydantic made it simple"
long_description = "ODM with pydantic made it simple"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ['version']
authors = [{ name = "Tiago Silva", email = "tiago.arasivla@gmail.com" }]
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: AnyIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["pymongo>=4.13,<5.0", "pydantic-settings>=2.9.0", "orjson>=3.9.5"]
keywords = ["mongoz", "odm", "nosql", "mongodb"]

[project.urls]
Homepage = "https://github.com/dymmond/mongoz"
Documentation = "https://mongoz.dymmond.com"
Changelog = "https://mongoz.dymmond.com/release-notes/"
Funding = "https://github.com/sponsors/tarsil"
Source = "https://github.com/dymmond/mongoz"


[tool.hatch.version]
path = "mongoz/__init__.py"

[project.optional-dependencies]
testing = [
    "a2wsgi==1.10.10",
    "anyio==4.14.2",
    "httpx==0.28.1",
    "lilya==0.27.1",
    "orjson==3.12.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pymongo==4.17.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ravyn[standard]==0.4.1",
    "tomli>=2.0.0; python_version < '3.11'",
]

quality = [
    "mypy==1.16.1",
    "pre-commit==4.3.0",
    "ruff==0.16.5",
]

packaging = [
    "twine==7.0.0",
]

docs = [
    "griffe-typingdoc>=0.2.2,<1.0",
    "mdx-include>=1.4.2,<2.0.0",
    "mkautodoc>=0.2.0,<0.3.0",
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-macros-plugin>=0.4.0",
    "mkdocs-material>=9.4.4,<10.0.0",
    "mkdocs-meta-descriptions-plugin>=2.3.0",
    "mkdocstrings[python]>=0.23.0,<0.30.0",
    "pyyaml>=6.0,<7.0.0",
]

[tool.hatch.envs.default]
features = ["quality", "packaging"]
dependencies = [
    "devtools>=0.12.2",
    "ipython",
    "ptpython",
]

[tool.hatch.envs.default.scripts]
clean_pyc = "find . -type f -name \"*.pyc\" -delete"
clean_pyi = "find . -type f -name \"*.pyi\" -delete"
clean_pycache = "find . -type d -name \"*__pycache__*\" -delete"
lint = "ruff check mongoz tests scripts {args}"
format-check = "ruff format --check mongoz tests scripts {args}"
format = [
    "ruff check --fix mongoz tests scripts {args}",
    "ruff format mongoz tests scripts {args}",
]
typing = "mypy -p mongoz {args}"
quality = [
    "hatch run lint",
    "hatch run format-check",
    "hatch run typing",
    "hatch run test:coverage",
]

[tool.hatch.envs.docs]
features = ["docs"]
dependencies = []

[tool.hatch.envs.docs.scripts]
update_languages = "scripts/docs.py update-languages"
build = "hatch run docs:update_languages; scripts/docs.py build-all"
build_lang = "hatch run docs:update_languages; scripts/docs.py build --lang {args}"
serve = "hatch run docs:update_languages; scripts/docs.py live"
dev = "hatch run docs:update_languages; scripts/docs.py serve"
serve_lang = "hatch run docs:update_languages; scripts/docs.py live --lang {args}"
new_lang = "hatch run docs:update_languages; scripts/docs.py new-lang --lang {args}"

[tool.hatch.envs.test]
features = ["testing"]
dependencies = []

[tool.hatch.envs.test.scripts]
# needs docker services running
test = "pytest --disable-warnings tests {args}"
focused = "pytest --disable-warnings {args}"
warnings = "pytest --disable-warnings -p scripts.pytest_warning_policy tests {args}"
coverage = "pytest --disable-warnings -p scripts.pytest_warning_policy --cov=mongoz --cov-branch --cov-config=pyproject.toml --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=json:coverage.json tests {args}"

[tool.hatch.envs.matrix]
template = "test"

[[tool.hatch.envs.matrix.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.package]
features = ["packaging"]
dependencies = []


[tool.mypy]
warn_unused_configs = true
warn_unreachable = true
warn_return_any = true
strict = true
disallow_untyped_decorators = true
disallow_any_generics = false
implicit_reexport = false
no_implicit_optional = false
show_error_codes = true
disallow_incomplete_defs = true
disable_error_code = "attr-defined,arg-type,override,misc,valid-type,call-overload,no-any-return"
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "C", "B", "I"]
ignore = ["E501", "B008", "C901", "B026"]

exclude = ["docs_src/"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.coverage.run]
branch = true
relative_files = true
source = ["mongoz"]

[tool.coverage.report]
# Corrected Python 3.13 baseline measured on 2026-09-01: 88.97% branch coverage.
# The 88.95 floor allows display rounding only; losing one covered line fails.
fail_under = 88.95
precision = 2
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"

[tool.mongoz.warning-ratchet]
# Campaign 3 owns removal of the Pydantic/model-construction warning debt.
"builtins.UserWarning" = 91
"pydantic.warnings.PydanticDeprecatedSince20" = 614
"pydantic.warnings.PydanticDeprecatedSince211" = 11570

[[tool.mypy.overrides]]
module = "mongoz.tests.*"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "docs_src.*"
ignore_errors = true


[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
xfail_strict = true
junit_family = "xunit2"

[tool.hatch.build.targets.sdist]
include = ["/mongoz"]
