---
name: Docs Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  docs-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine changed files
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$BASE" "$HEAD" > changed_files.txt

      - name: Docs relevance check
        shell: bash
        run: |
          set -euo pipefail

          PUBLIC_PATTERNS=(
            '^mongoz/'
            '^scripts/'
            '^examples?/'
            '^docs_src/'
            '^.*(public|api)\.py$'
          )

          DOCS_PATTERNS=(
            '^docs/'
            '^README\.md$'
            '^CHANGELOG\.md$'
            '^mkdocs\.yaml$'
            '^scripts/docs'
          )

          changed_public=0
          changed_docs=0

          while read -r file; do
            for pattern in "${PUBLIC_PATTERNS[@]}"; do
              if [[ "$file" =~ $pattern ]]; then changed_public=1; fi
            done
            for pattern in "${DOCS_PATTERNS[@]}"; do
              if [[ "$file" =~ $pattern ]]; then changed_docs=1; fi
            done
          done < changed_files.txt

          echo "changed_public=$changed_public"
          echo "changed_docs=$changed_docs"

          if [[ "$changed_public" == "1" && "$changed_docs" == "0" ]]; then
            echo "::error::This PR changes public surface areas but does not update documentation."
            echo "Changed files:"
            cat changed_files.txt
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Hatch
        run: pip install "hatch==1.16.5"

      - name: Validate documentation
        run: hatch run docs:validate
