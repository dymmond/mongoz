---
name: Documentation

on:
  push:
    branches: ["**"]
    paths:
      - "docs/**"
      - "docs_src/**"
      - "mkdocs.yaml"
      - "scripts/docs.py"
      - "scripts/docs_pipeline.py"
      - "scripts/validate_docs.py"
      - "Taskfile.yaml"
      - "pyproject.toml"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - "docs_src/**"
      - "mkdocs.yaml"
      - "scripts/docs.py"
      - "scripts/docs_pipeline.py"
      - "scripts/validate_docs.py"
      - "Taskfile.yaml"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: "documentation-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Strict build and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install "hatch==1.16.5"
      - run: hatch run docs:validate
