---
name: Documentation

on:
  push:
    branches: ["**"]
    paths:
      - "docs/**"
      - "docs_src/**"
      - "scripts/docs.py"
      - "scripts/hooks.py"
      - "scripts/validate_docs.py"
      - "pyproject.toml"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - "docs_src/**"
      - "scripts/docs.py"
      - "scripts/hooks.py"
      - "scripts/validate_docs.py"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: "documentation-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Strict build and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install "hatch==1.16.5"
      - run: hatch run docs:validate
