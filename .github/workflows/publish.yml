---
name: Publish

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  publish:
    name: "Publish release"
    runs-on: "ubuntu-latest"

    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: "Install dependencies"
        run: python -m pip install "hatch==1.16.5"
      - name: "Start canonical MongoDB topology"
        run: "hatch run mongodb-standalone-up"
      - name: "Validate package"
        env:
          DATABASE_URI: "mongodb://root:mongoadmin@localhost:27017/?authSource=admin"
        run: "hatch run package:validate"
      - name: "Stop canonical MongoDB topology"
        if: always()
        run: "hatch run mongodb-standalone-down"
      - name: "Publish to PyPI"
        run: "scripts/publish"
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      - name: "Deploy docs"
        run: |
          curl -X POST '${{ secrets.DEPLOY_DOCS }}'
