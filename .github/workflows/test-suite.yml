---
name: Test Suite

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "docs_src/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "docs_src/**"
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: "test-suite-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  DATABASE_URI: "mongodb://root:mongoadmin@localhost:27017/?authSource=admin"
  HATCH_VERSION: "1.16.5"

jobs:
  static-quality:
    name: Static quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install "hatch==${HATCH_VERSION}"
      - run: hatch run lint
      - run: hatch run format-check
      - run: hatch run typing
      - run: hatch run typing-negative
      - run: hatch run pre-commit-check

  tests:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install "hatch==${HATCH_VERSION}"
      - run: hatch run mongodb-standalone-up
      - run: hatch run test:test -q
      - if: always()
        run: hatch run mongodb-standalone-down

  coverage:
    name: Coverage and warning ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install "hatch==${HATCH_VERSION}"
      - run: hatch run mongodb-standalone-up
      - run: hatch run test:coverage -q
      - if: always()
        run: hatch run mongodb-standalone-down

  replica-set:
    name: Replica-set transactions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install "hatch==${HATCH_VERSION}"
      - run: hatch run mongodb-replica-set-up
      - run: hatch run mongodb-replica-set-smoke
      - if: always()
        run: hatch run mongodb-replica-set-down

  package:
    name: Installed-wheel proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install "hatch==${HATCH_VERSION}"
      - run: hatch run mongodb-standalone-up
      - run: hatch run package:validate
      - if: always()
        run: hatch run mongodb-standalone-down
