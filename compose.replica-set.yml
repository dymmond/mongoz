services:
  mongodb-rs:
    image: mongo:8.0.29@sha256:02a0cc7939f5ed38f30f9bc714ef5f682d49baf9350c54acf302ce833087fe8a
    command:
      - mongod
      - --replSet
      - mongoz-rs
      - --bind_ip_all
      - --port
      - "27018"
    ports:
      - "127.0.0.1:27018:27018"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --port 27018 --eval
          "try {
            if (db.hello().isWritablePrimary) { quit(0) };
            rs.initiate({_id: 'mongoz-rs', members: [{_id: 0, host: 'localhost:27018'}]});
            quit(1)
          } catch (error) { quit(1) }"
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    volumes:
      - mongodb_rs_data:/data/db

volumes:
  mongodb_rs_data:
